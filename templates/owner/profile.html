{% extends "owner/_layout.html" %}
{% set active_page = "profile" %}
{% block title %}My Profile - NestIn{% endblock %}

{% block dash_content %}
<div class="dash-header"><h2>My Profile</h2></div>

<div class="panel" style="max-width:560px;">
    <div style="text-align:center;">
        <div class="profile-pic-wrap">
            <img src="{{ url_for('public.profile_pic', filename=current_user.profile_pic) }}" class="profile-pic-large" alt="{{ current_user.full_name }}">
            <form method="post" action="{{ url_for('owner.update_profile_picture') }}" enctype="multipart/form-data" style="display:inline;">
                <label class="pic-upload-btn" for="profile_pic_upload">+</label>
                <input type="file" id="profile_pic_upload" name="profile_pic" accept="image/*" style="display:none;" data-autosubmit="true">
            </form>
        </div>
        {% if current_user.profile_pic != "default.svg" %}
        <form method="post" action="{{ url_for('owner.delete_profile_picture') }}" style="margin-bottom:20px;">
            <button type="submit" class="btn btn-sm btn-outline">Remove Photo</button>
        </form>
        {% endif %}
    </div>

    <form method="post">
        <div class="form-group">
            <label for="full_name">Full Name</label>
            <input type="text" id="full_name" name="full_name" value="{{ current_user.full_name }}">
        </div>
        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="text" id="phone" name="phone" value="{{ current_user.phone or '' }}">
        </div>
        <div class="form-group">
            <label for="location">Location</label>
            <input type="text" id="location" name="location" value="{{ current_user.location or '' }}">
        </div>
        <div class="form-group">
            <label for="house_number">House Number</label>
            <input type="text" id="house_number" name="house_number" value="{{ current_user.house_number or '' }}">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" value="{{ current_user.email }}" disabled>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Save Changes</button>
    </form>
</div>
{% endblock %}
